<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="styles.css?v=3" />
		<link rel="icon" type="image/x-icon" href="images/timer.svg" />
		<script src="script.js" defer></script>
		<title>Pomodoro Timer</title>
	</head>
	<body>
		<image id="tomato" class="tomato" src="images/Pomodoro timer.png"></image>
		<div>
			<h1>Pomodoro Timer</h1>
			<div class="main">
				<image id="tolltip" class="tolltip" src="images/tooltip.svg">
					<span id="tooltip-text" class="tooltip-text">P</span>
				</image>
				<div class="timer-div">
					<p class="timer" id="timer">25:00</p>
					<div class="buttons">
						<button id="start-btn">
							<image class="btn_img" src="images/play.svg"></image>
						</button>
						<button class="pause" id="pause-btn">
							<image class="btn_img" src="images/pause.svg"></image>
						</button>
					</div>
				</div>
				<audio loop id="background-music">
					<source src="" type="audio/ogg" />
					Your browser does not support the audio element.
				</audio>
			</div>
		</div>
	</body>
</html>
